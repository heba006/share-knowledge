
name: Deploy Share Knowledge

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify website files
        run: |
          test -f index.php || {
            echo "ERROR: index.php is missing"
            exit 1
          }

          test -f login.php || {
            echo "ERROR: login.php is missing"
            exit 1
          }

          test -d assets || {
            echo "ERROR: assets folder is missing"
            exit 1
          }

          echo "Website files verified successfully"

      - name: Upload website to InfinityFree
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib
          import os

          excluded_files = {
              "db.php",
              ".gitignore",
              "test_db.php"
          }

          excluded_dirs = {
              ".git",
              ".github",
              "share_knowledge_private_uploads"
          }

          ftp = ftplib.FTP()
          ftp.connect(
              os.environ["FTP_SERVER"],
              21,
              timeout=30
          )

          ftp.login(
              os.environ["FTP_USERNAME"],
              os.environ["FTP_PASSWORD"]
          )

          ftp.cwd("/htdocs")

          uploaded = 0

          for root, dirs, files in os.walk("."):
              dirs[:] = [
                  d for d in dirs
                  if d not in excluded_dirs
              ]

              relative = os.path.relpath(root, ".")

              ftp.cwd("/htdocs")

              if relative != ".":
                  for part in relative.split(os.sep):
                      try:
                          ftp.mkd(part)
                      except ftplib.error_perm as error:
                          if not str(error).startswith("550"):
                              raise

                      ftp.cwd(part)

              for filename in files:
                  if filename in excluded_files:
                      continue

                  local_path = os.path.join(
                      root,
                      filename
                  )

                  with open(local_path, "rb") as file:
                      ftp.storbinary(
                          "STOR " + filename,
                          file
                      )

                  uploaded += 1

          ftp.quit()

          if uploaded == 0:
              raise RuntimeError(
                  "No website files were uploaded"
              )

          print(
              f"Successfully uploaded {uploaded} files"
          )
          PY

