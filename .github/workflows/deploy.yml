
name: Deploy Share Knowledge

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-ftp:
    runs-on: ubuntu-latest

    steps:
      - name: Test InfinityFree FTP connection
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib
          import os

          ftp = ftplib.FTP()
          ftp.connect(os.environ["FTP_SERVER"], 21, timeout=30)
          ftp.login(
              os.environ["FTP_USERNAME"],
              os.environ["FTP_PASSWORD"]
          )
          print("FTP connection successful")
          ftp.quit()
          PY
          
      - name: Upload website to InfinityFree
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib
          import os

          ftp = ftplib.FTP()
          ftp.connect(os.environ["FTP_SERVER"], 21, timeout=30)
          ftp.login(os.environ["FTP_USERNAME"], os.environ["FTP_PASSWORD"])

          ftp.cwd("htdocs")

          excluded_files = {"db.php", ".gitignore", "test_db.php"}
          excluded_dirs = {".git", ".github", "share_knowledge_private_uploads"}

          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in excluded_dirs]
              relative = os.path.relpath(root, ".")
              if relative == ".":
                  relative = ""

              for filename in files:
                  if filename in excluded_files:
                      continue

                  local_path = os.path.join(root, filename)
                  remote_dir = "/htdocs"

                  if relative:
                      for part in relative.split(os.sep):
                          remote_dir += "/" + part
                          try:
                              ftp.mkd(remote_dir)
                          except ftplib.error_perm as error:
                              if not str(error).startswith("550"):
                                  raise

                  remote_path = remote_dir + "/" + filename
                  with open(local_path, "rb") as file:
                      ftp.storbinary("STOR " + remote_path, file)

          ftp.quit()
          print("Website files uploaded successfully")
          PY

